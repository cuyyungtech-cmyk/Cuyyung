<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kejutan Cinta Untuk Nurul Ezlynn</title>
  <style>
    :root {
      --neon-pink: #ff1e8a;
      --neon-pink-soft: #ff6ec4;
      --neon-glow: 0 0 18px rgba(255, 30, 138, 0.85), 0 0 42px rgba(255, 30, 138, 0.55);
      --bg-dark: #09050d;
      --glass-bg: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.28);
      --text-main: #ffffff;
      --text-muted: #f3d6e8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top, #24091d 0%, var(--bg-dark) 70%);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ================= HALAMAN 1: KACA HATI NEON PINK ================= */
    #page1 {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 36px 22px 32px;
      background: radial-gradient(circle at 50% 30%, rgba(255, 30, 138, 0.16), transparent 60%), var(--bg-dark);
      transition: filter 0.85s ease, opacity 0.85s ease, transform 0.85s ease;
    }

    #page1.blur-exit {
      filter: blur(26px);
      opacity: 0;
      transform: scale(1.08);
      pointer-events: none;
    }

    .top-badge {
      font-size: 0.78rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--neon-pink-soft);
      background: rgba(255, 30, 138, 0.12);
      border: 1px solid rgba(255, 30, 138, 0.35);
      padding: 7px 16px;
      border-radius: 999px;
      box-shadow: 0 0 16px rgba(255, 30, 138, 0.25);
    }

    .heart-stage {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin: auto 0;
    }

    .heart-glass-wrapper {
      position: relative;
      width: 240px;
      height: 225px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 0 24px rgba(255, 30, 138, 0.45));
    }

    .heart-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .heart-glass-shell {
      fill: rgba(255, 255, 255, 0.06);
      stroke: rgba(255, 255, 255, 0.55);
      stroke-width: 2.5;
    }

    .heart-glass-highlight {
      fill: none;
      stroke: rgba(255, 255, 255, 0.38);
      stroke-width: 2;
      stroke-linecap: round;
    }

    .neon-water-rect {
      fill: url(#neonPinkGrad);
      transition: y 0.08s linear;
    }

    .water-wave-line {
      stroke: #ff9be2;
      stroke-width: 2.2;
      fill: none;
      opacity: 0.85;
    }

    .fill-percent {
      font-size: 1.5rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: var(--neon-glow);
      letter-spacing: 1px;
    }

    .hint-text {
      font-size: 0.92rem;
      color: var(--text-muted);
      text-align: center;
      max-width: 290px;
      line-height: 1.45;
    }

    /* Butang Leret Untuk Membuka */
    .slider-container {
      width: 100%;
      max-width: 360px;
      height: 62px;
      background: var(--glass-bg);
      border: 1.5px solid var(--glass-border);
      border-radius: 999px;
      position: relative;
      display: flex;
      align-items: center;
      padding: 5px;
      backdrop-filter: blur(14px);
      box-shadow: inset 0 0 18px rgba(255, 255, 255, 0.05), 0 10px 28px rgba(0, 0, 0, 0.45);
      user-select: none;
      touch-action: none;
    }

    .slider-progress {
      position: absolute;
      left: 0;
